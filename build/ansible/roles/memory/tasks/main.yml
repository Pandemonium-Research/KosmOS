---
# roles/memory — ChromaDB persistent vector store

- name: Install ChromaDB into kosmos venv
  become_user: "{{ kosmos_user }}"
  # sentence-transformers is intentionally excluded — it pulls torch with the
  # full CUDA toolkit (~2.5 GB) which exhausts disk space during the build.
  # ChromaDB's DefaultEmbeddingFunction uses ONNX (not torch), so this is fine.
  command: "uv pip install --python {{ kosmos_venv }}/bin/python chromadb"
  register: chroma_pip
  changed_when: "'already installed' not in chroma_pip.stdout"

- name: Create ChromaDB data directory
  file:
    path: "{{ kosmos_data_dir }}/chroma"
    state: directory
    owner: "{{ kosmos_user }}"
    group: "{{ kosmos_user }}"
    mode: "0755"

- name: Deploy ChromaDB systemd service
  template:
    src: chromadb.service.j2
    dest: /etc/systemd/system/chromadb.service
    mode: "0644"
  notify:
    - reload systemd
    - restart chromadb

- name: Enable and start ChromaDB
  systemd:
    name: chromadb
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for ChromaDB to be ready
  uri:
    url: "http://127.0.0.1:{{ chromadb_port }}/api/v1/heartbeat"
    status_code: 200
  register: chroma_ready
  retries: 15
  delay: 3
  until: chroma_ready.status == 200

- name: Create default KosmOS collection
  uri:
    url: "http://127.0.0.1:{{ chromadb_port }}/api/v1/collections"
    method: POST
    body_format: json
    body:
      name: "kosmos"
      metadata:
        description: "Default KosmOS agent memory collection"
    status_code: [200, 201, 409]   # 409 = already exists, that's fine

- name: Pre-warm ChromaDB embedding model
  # Triggers the ~90 MB model download at image build time so the first
  # agent query does not stall waiting for a network fetch.
  become_user: "{{ kosmos_user }}"
  command:
    argv:
      - "{{ kosmos_venv }}/bin/python"
      - "-c"
      - |
          from chromadb.utils.embedding_functions import DefaultEmbeddingFunction
          DefaultEmbeddingFunction()(["warmup"])
  environment:
    HOME: "{{ kosmos_home }}"
  args:
    creates: "{{ kosmos_home }}/.cache/chroma/onnx_models/all-MiniLM-L6-v2/onnx.tar.gz"
