---
# roles/agent — Python packages, Node.js LTS, Rust toolchain, Claude Code CLI
# Python 3.12, uv, and the kosmos venv are created by the base role.

# ── Python packages ────────────────────────────────────────────────────────────

- name: Install Python packages into kosmos venv
  become_user: "{{ kosmos_user }}"
  command: "uv pip install --python {{ kosmos_venv }}/bin/python {{ item }}"
  loop: "{{ kosmos_python_packages }}"
  register: pip_install
  changed_when: "'already installed' not in pip_install.stdout"

- name: Install Playwright browsers
  become_user: "{{ kosmos_user }}"
  command: "{{ kosmos_venv }}/bin/playwright install chromium --with-deps"
  args:
    creates: "{{ kosmos_home }}/.cache/ms-playwright"

# ── Node.js LTS (via NodeSource) ───────────────────────────────────────────────

- name: Create apt keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download NodeSource GPG key
  shell: |
    curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key \
      | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
  args:
    creates: /etc/apt/keyrings/nodesource.gpg

- name: Add NodeSource LTS repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main"
    state: present
    filename: nodesource

- name: Install Node.js LTS
  apt:
    name: nodejs
    state: present
    update_cache: true

- name: Install npm global packages
  npm:
    name: "{{ item }}"
    global: true
    state: present
  loop:
    - typescript
    - ts-node

# ── Rust toolchain ─────────────────────────────────────────────────────────────

- name: Install Rust via rustup (system-wide)
  shell: |
    curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
      sh -s -- -y --no-modify-path --default-toolchain stable
  args:
    creates: /usr/local/cargo/bin/rustc
  environment:
    CARGO_HOME: /usr/local/cargo
    RUSTUP_HOME: /usr/local/rustup

- name: Add Rust to system PATH via profile.d
  copy:
    dest: /etc/profile.d/rust.sh
    content: |
      export CARGO_HOME=/usr/local/cargo
      export RUSTUP_HOME=/usr/local/rustup
      export PATH="${CARGO_HOME}/bin:${PATH}"
    mode: "0644"

# ── Claude Code CLI ────────────────────────────────────────────────────────────

- name: Install Claude Code CLI via npm
  npm:
    name: "@anthropic-ai/claude-code"
    global: true
    state: present

# ── Shell environment ──────────────────────────────────────────────────────────

- name: Configure kosmos user environment
  blockinfile:
    path: "{{ kosmos_home }}/.bashrc"
    marker: "# {mark} KOSMOS env"
    block: |
      # KosmOS environment
      source /etc/profile.d/rust.sh 2>/dev/null || true
      export PATH="{{ kosmos_venv }}/bin:$PATH"
      export VIRTUAL_ENV="{{ kosmos_venv }}"
      export LITELLM_API_BASE="http://127.0.0.1:{{ litellm_port }}/v1"
      export OPENAI_API_BASE="http://127.0.0.1:{{ litellm_port }}/v1"
      export OPENAI_API_KEY="kosmos-local"

      # Source cloud API keys if set
      [ -f /etc/kosmos/env ] && source /etc/kosmos/env

      # Aliases
      alias claude='claude --model claude-sonnet-4-6'
      alias ll='ls -lah'
    create: true
    owner: "{{ kosmos_user }}"
    group: "{{ kosmos_user }}"
    mode: "0644"

- name: Apply kosmos env block to .bash_profile for login shells
  blockinfile:
    path: "{{ kosmos_home }}/.bash_profile"
    marker: "# {mark} KOSMOS env"
    block: |
      # KosmOS environment
      source /etc/profile.d/rust.sh 2>/dev/null || true
      export PATH="{{ kosmos_venv }}/bin:$PATH"
      export VIRTUAL_ENV="{{ kosmos_venv }}"
      export LITELLM_API_BASE="http://127.0.0.1:{{ litellm_port }}/v1"
      export OPENAI_API_BASE="http://127.0.0.1:{{ litellm_port }}/v1"
      export OPENAI_API_KEY="kosmos-local"

      # Source cloud API keys if set
      [ -f /etc/kosmos/env ] && source /etc/kosmos/env

      # Aliases
      alias claude='claude --model claude-sonnet-4-6'
      alias ll='ls -lah'
    create: true
    owner: "{{ kosmos_user }}"
    group: "{{ kosmos_user }}"
    mode: "0644"
